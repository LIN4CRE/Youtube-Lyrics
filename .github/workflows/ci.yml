name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-docs:
    name: Core tests, build tooling and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Python tooling
        run: python3 -m pip install --disable-pip-version-check ziglang==0.17.1 Pillow==13.0.0
      # The docs check compares the version, size and checksum printed on the
      # site with the real executable, so a build has to exist first.
      - name: Build the Windows GUI executable
        shell: bash
        run: |
          ZIG="$(python3 -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).with_name("zig"))')"
          ZIG="$ZIG" ./scripts/build.sh
      - name: Sanitizer-backed core tests and tooling tests
        run: ./scripts/test.sh
      - name: Check static pages, release facts and local links
        run: |
          python3 scripts/check_docs.py
          python3 scripts/release_facts.py --check
      - name: Verify the built executable and assets
        run: |
          python3 scripts/verify_build.py dist/YoutubeLyrics.exe --ico docs/brand/YoutubeLyrics.ico
          python3 scripts/verify_build.py docs/downloads/YoutubeLyrics.exe
          python3 scripts/make_icon.py --verify .build/app.ico
      - name: Confirm the downloadable copy is the verified build
        run: |
          sha256sum dist/YoutubeLyrics.exe docs/downloads/YoutubeLyrics.exe
          if [ "$(tr -d '[:space:]' < RELEASE_CHANNEL)" = stable ]; then
            cmp dist/YoutubeLyrics.exe docs/downloads/YoutubeLyrics.exe
          else
            echo "development channel: docs/downloads keeps the last stable release"
          fi
      # The build is reproducible, so rebuilding this commit must give back
      # exactly the download that is committed and served by the site.
      - name: Confirm the committed download is the build of this commit
        run: |
          if ! git diff --exit-code --stat -- docs/downloads dist/YoutubeLyrics.exe; then
            echo "::error::The committed download differs from a fresh build of this commit. Run ./scripts/build.sh with the pinned toolchain and commit the result."
            exit 1
          fi
      # The same gate the stable-release workflow runs before publishing, so a
      # commit that could not be released is caught here, not at tag time.
      - name: Dry-run the release gate (nothing is published)
        run: |
          if [ "$(tr -d '[:space:]' < RELEASE_CHANNEL)" = stable ]; then
            python3 scripts/verify_release.py --tag "v$(cat VERSION)" --built dist/YoutubeLyrics.exe --ref HEAD --output-dir .build/release
          else
            echo "development channel: nothing to release"
          fi

  windows-native:
    name: Windows native build and resource check
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Zig and Pillow
        shell: pwsh
        run: python -m pip install "Pillow==13.0.0" "ziglang==0.17.1"
      - name: Build on Windows with the gated PowerShell script
        shell: pwsh
        run: |
          $env:ZIG = (python -c "import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).with_name('zig.exe'))")
          ./scripts/build.ps1
      - name: Verify the Windows build output
        shell: pwsh
        run: |
          python scripts/verify_build.py dist/YoutubeLyrics.exe --ico .build/app.ico
          python scripts/verify_build.py docs/downloads/YoutubeLyrics.exe
          python scripts/release_facts.py --check
          python scripts/check_docs.py
      - name: Report the embedded version resource
        shell: pwsh
        run: |
          $info = (Get-Item dist/YoutubeLyrics.exe).VersionInfo
          Write-Host "FileVersion:    $($info.FileVersion)"
          Write-Host "ProductVersion: $($info.ProductVersion)"
          Write-Host "ProductName:    $($info.ProductName)"
          if (-not $info.FileVersion) { throw 'the executable carries no version resource' }
      - name: Load the executable on Windows
        shell: pwsh
        run: |
          # A real Windows PE load: this fails if the binary or its imports are
          # broken, which cross-compilation alone cannot prove.
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class PeLoad {
            [DllImport("kernel32", SetLastError = true, CharSet = CharSet.Unicode)]
            public static extern IntPtr LoadLibraryEx(string path, IntPtr file, uint flags);
            [DllImport("kernel32", SetLastError = true)]
            public static extern bool FreeLibrary(IntPtr module);
          }
          '@
          $path = (Resolve-Path dist/YoutubeLyrics.exe).Path
          $module = [PeLoad]::LoadLibraryEx($path, [IntPtr]::Zero, 0x00000002) # LOAD_LIBRARY_AS_DATAFILE
          if ($module -eq [IntPtr]::Zero) {
            throw "Windows could not load the executable as an image (error $([Runtime.InteropServices.Marshal]::GetLastWin32Error()))"
          }
          [void][PeLoad]::FreeLibrary($module)
          Write-Host 'the executable loaded as a valid Windows image'
      # The first step that actually executes the program on Windows. It runs
      # without a window, reads the configuration, enumerates monitors, contacts
      # each lyric provider and update source, and writes a report.
      - name: Run the executable on Windows (diagnostic report)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'ytl-diagnostics.txt'
          $process = Start-Process -FilePath (Resolve-Path dist/YoutubeLyrics.exe).Path `
            -ArgumentList '--diagnostics', "`"$report`"" -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw 'the executable did not finish writing a diagnostic report within 120 s'
          }
          if ($process.ExitCode -ne 0) { throw "the executable exited with code $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'no diagnostic report was written' }
          Get-Content $report -Encoding UTF8
          $text = Get-Content $report -Raw -Encoding UTF8
          $version = (Get-Content VERSION -Raw).Trim()
          if ($text -notmatch [regex]::Escape("Version:") -or $text -notmatch [regex]::Escape($version)) {
            throw "the report does not state version $version"
          }
          if ($text -match [regex]::Escape($env:USERNAME)) {
            throw 'the report contains the Windows account name; redaction failed'
          }
      # Headless checks inside the real program on real Windows: data-folder
      # reads and writes, settings, the media listener starting and stopping,
      # leaving during a lyric request, and report redaction. It proves nothing
      # about what the window, tray or desktop mode look like.
      - name: Run the self-test on Windows
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'ytl-self-test.txt'
          $process = Start-Process -FilePath (Resolve-Path dist/YoutubeLyrics.exe).Path `
            -ArgumentList '--self-test', "`"$result`"" -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            throw 'the self-test did not finish within 180 s'
          }
          if (Test-Path $result) { Get-Content $result -Encoding UTF8 } else { throw 'the self-test wrote no result file' }
          if ($process.ExitCode -ne 0) { throw "the self-test failed (exit code $($process.ExitCode))" }
          $text = Get-Content $result -Raw -Encoding UTF8
          if ($text -notmatch 'RESULT: PASS') { throw 'the self-test result file does not say PASS' }
          if ($text -match 'FAIL  ') { throw 'a self-test check failed' }
          if ($text -match [regex]::Escape($env:USERNAME)) {
            throw 'the self-test output contains the Windows account name; redaction failed'
          }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'YouTubeLyrics\self-test-probe.txt')) {
            throw 'the self-test left its probe file behind'
          }
      # Starts the real program with its window and message loop, confirms it
      # stays up and refuses a second copy, then ends it the way Quit does and
      # requires a clean shutdown with every worker stopped. The runner has a
      # desktop session but nobody looks at it: this does not show the window
      # is drawn correctly.
      - name: Start the program, then shut it down cleanly
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/YoutubeLyrics.exe).Path
          $log = Join-Path $env:LOCALAPPDATA 'YouTubeLyrics\ytlyrics.log'
          if (Test-Path $log) { Remove-Item $log }

          $none = Start-Process -FilePath $exe -ArgumentList '--quit' -PassThru -Wait
          if ($none.ExitCode -ne 2) { throw "--quit with nothing running returned $($none.ExitCode), expected 2" }

          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) {
            if (Test-Path $log) { Get-Content $log -Encoding UTF8 }
            throw "the program exited by itself within 8 s (exit code $($app.ExitCode))"
          }

          # A second copy must hand over to the first and leave.
          $second = Start-Process -FilePath $exe -PassThru
          if (-not $second.WaitForExit(15000)) {
            $second.Kill(); $app.Kill()
            throw 'a second copy kept running; the single-instance check failed'
          }
          if ($app.HasExited) { throw 'starting a second copy ended the first' }

          $quit = Start-Process -FilePath $exe -ArgumentList '--quit' -PassThru -Wait
          if ($quit.ExitCode -ne 0) { $app.Kill(); throw "--quit returned $($quit.ExitCode), expected 0" }
          if (-not $app.WaitForExit(20000)) {
            $app.Kill()
            if (Test-Path $log) { Get-Content $log -Encoding UTF8 }
            throw 'the program did not exit within 20 s of being asked to quit'
          }
          if ($app.ExitCode -ne 0) { throw "the program exited with code $($app.ExitCode)" }

          Get-Content $log -Encoding UTF8
          $text = Get-Content $log -Raw -Encoding UTF8
          $version = (Get-Content VERSION -Raw).Trim()
          if ($text -notmatch [regex]::Escape("started $version")) { throw 'the log has no start line for this version' }
          if ($text -notmatch 'stopped \(clean\)') { throw 'the log does not record a clean stop' }
          $left = Get-Process -Name YoutubeLyrics -ErrorAction SilentlyContinue
          if ($left) { $left | Stop-Process -Force; throw 'a YoutubeLyrics process was left running' }
