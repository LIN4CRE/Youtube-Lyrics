name: Stable release

# Publishes a GitHub Release for a stable tag. Nothing is uploaded unless the
# executable rebuilt from the tagged source is byte-for-byte the file the
# project site already serves (docs/downloads) and every piece of release
# metadata agrees with it. See scripts/verify_release.py for the exact checks
# and scripts/publish_release.sh for how publishing is made safe to retry.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag to publish (for example v1.7.1). Run this from the commit on main that the tag names.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish the Windows x64 stable release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out the source being released
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require a stable tag that matches VERSION
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          import verify_release
          from pathlib import Path
          version = Path('VERSION').read_text(encoding='ascii').strip()
          try:
              verify_release.check_version_and_tag(version, os.environ['RELEASE_TAG'])
          except verify_release.ReleaseError as exc:
              raise SystemExit(f'RELEASE BLOCKED: {exc}')
          print(f"tag {os.environ['RELEASE_TAG']} matches VERSION {version}")
          PY

      - name: Require the commit to be on main and the tag to name it
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "RELEASE BLOCKED: $GITHUB_SHA is not on main. Releases are cut only from commits that the site has already deployed." >&2
            exit 1
          fi
          existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" "refs/tags/$RELEASE_TAG" | sort -k2 | tail -n 1 | cut -f1)"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "RELEASE BLOCKED: tag $RELEASE_TAG already names $existing, not the commit being built ($GITHUB_SHA)." >&2
            exit 1
          fi
          echo "commit $GITHUB_SHA is on main; tag $RELEASE_TAG is ${existing:+already at this commit}${existing:-not created yet}"

      - name: Install the pinned build tools
        run: python3 -m pip install --disable-pip-version-check ziglang==0.17.1 Pillow==13.0.0

      # Before anything is rebuilt: the committed download, checksum, manifest,
      # site and README must already agree with each other.
      - name: Test the committed source and the committed download
        run: ./scripts/test.sh

      - name: Rebuild the executable from this source
        shell: bash
        run: |
          ZIG="$(python3 -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).with_name("zig"))')"
          ZIG="$ZIG" PYTHON=python3 ./scripts/build.sh
          python3 scripts/make_icon.py --verify .build/app.ico

      # The build writes into docs/ and dist/. If that changed a single byte of
      # anything tracked, the commit does not contain its own build.
      - name: Require the rebuild to reproduce every committed file
        run: |
          if ! git diff --exit-code --stat; then
            echo "RELEASE BLOCKED: rebuilding changed tracked files (listed above). The committed download or its metadata is not the build of this commit." >&2
            exit 1
          fi

      - name: Verify the build against the published download and write the assets
        run: python3 scripts/verify_release.py --tag "$RELEASE_TAG" --built dist/YoutubeLyrics.exe --ref "$GITHUB_SHA" --output-dir .build/release --repository "$GITHUB_REPOSITORY"

      - name: Publish (draft, upload, read back, then make public)
        run: ./scripts/publish_release.sh "$RELEASE_TAG" .build/release "$GITHUB_SHA"
